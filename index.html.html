<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOUSE OF MOTIVATION STORIES</title>
  <style>
    /* Reset and background setup */
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.7;
      color: #333333;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }

    /* Modern Hero Landing Box */
    .landing-card {
      background-color: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    /* Replacing marquee with an elegant, stable, modern header */
    h1 {
      font-size: 2.4rem;
      background: linear-gradient(135deg, #16a085, #2c3e50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Subtitle text styles */
    .subtitle {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .description {
      font-size: 1.1rem;
      color: #666666;
      margin-bottom: 40px;
    }

    /* Beautiful, clickable call-to-action button */
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 35px;
      font-size: 1.15rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #16a085, #1abc9c);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(22, 160, 133, 0.3);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* Hover animations for interactivity */
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(22, 160, 133, 0.4);
    }

    .cta-button:active {
      transform: translateY(0);
    }

    .cta-button span {
      margin-left: 8px;
      transition: transform 0.2s ease;
    }

    .cta-button:hover span {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="landing-card">
    
    <h1>Welcome to Our Website</h1>
    
    <p class="subtitle">House of Motivation Stories</p>
    
    <p class="description">
      Where you'll enjoy our best roaring motivation stories. You are warmly welcome!
    </p>

    <!-- Clean, properly structured anchor element with built-in arrow -->
    <a href="secondpage.html" class="cta-button">
      UNLEASH THE POWER NOW <span>&rarr;</span>
    </a>

  </div>

</body>
</html>
